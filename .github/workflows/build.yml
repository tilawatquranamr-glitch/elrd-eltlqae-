# AutoReply Android App

تطبيق لتنظيم الردود التلقائية ورسائل خدمة العملاء.

## 📦 المحتويات
- يحتوي هذا المستودع على الملف المضغوط للمشروع: `AutoReply-android.zip`.

## 🛠️ كيفية الاستخدام
1. قم بتحميل الملف المضغوط `AutoReply-android.zip`.
2. فك الضغط عن الملف على جهازك.
3. افتح المشروع باستخدام **Android Studio** لبدء التعديل أو البناء.
